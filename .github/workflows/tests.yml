name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -m unittest discover -v
      - name: Install the package
        run: python -m pip install --no-deps .
      - name: Check the installed command, registry, and man page
        run: |
          cd "$RUNNER_TEMP"
          spamalot --help
          python - <<'PY'
          import sys
          from pathlib import Path

          import spamalot

          assert spamalot.load_default_sources(), "Bundled source registry is empty"
          assert (Path(sys.prefix) / "share/man/man1/spamalot.1").is_file(), "Missing man page"
          PY
