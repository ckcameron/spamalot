name: Feature request
description: Suggest a new feature or an improvement to an existing workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current workflow falls short. Use dummy data in examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What change would help?
      description: Describe how you would use the feature. A sample command or output is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: If you have tried another approach, share what worked and what did not.
